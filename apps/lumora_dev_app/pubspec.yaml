name: lumora_dev_app
description: Official Flutter client for Lumora Dev v4.0
publish_to: "none"
version: 1.1.0+2
environment:
  sdk: ">=3.5.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.1.3
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  flutter_markdown: ^0.7.6+2
  gap: ^3.0.1
  uuid: ^4.5.1
  logger: ^2.5.0
  intl: ^0.20.2
  collection: ^1.19.1
  equatable: ^2.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
